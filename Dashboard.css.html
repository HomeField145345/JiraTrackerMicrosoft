<style>
    :root { 
        /* Base colors - ClickUp inspired */
        --bg: #f6f8fc;
        --surface: #ffffff;
        --ink: #1e1f21;
        --muted: #64748b;
        --line: #e2e8f0;
        
        /* Primary purple theme - ClickUp style */
        --primary: #7b68ee;
        --primary-light: #ebe9ff;
        --primary-ink: #fff;
        --primary-hover: #6553e0;
        
        /* Secondary colors */
        --secondary: #2563eb;
        --secondary-light: #ebf3ff;
        
        /* UI grays */
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;

        --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 8px -1px rgba(0, 0, 0, 0.07), 0 2px 6px -2px rgba(0, 0, 0, 0.04);
        
        --status-ok-bg: #f0fdf4; --status-ok-ink: #16a34a;
        --status-stale-bg: #fefce8; --status-stale-ink: #ca8a04;
        --status-review-bg: #eff6ff; --status-review-ink: #2563eb;
        --status-overdue-bg: #fef2f2; --status-overdue-ink: #dc2626;

        --type-epic-bg: #ede9fe; --type-epic-ink: #7c3aed;
        --type-story-bg: #dcfce7; --type-story-ink: #16a34a;
        --type-bug-bg: #fee2e2; --type-bug-ink: #dc2626;
    }
    
    /* UAT Status Badges */
    .uat-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        font-size: 0.8rem;
        font-weight: 500;
        white-space: nowrap;
    }
    
    .uat-pass { background-color: var(--status-ok-bg); color: var(--status-ok-ink); }
    .uat-fail { background-color: var(--status-overdue-bg); color: var(--status-overdue-ink); }
    .uat-pending { background-color: var(--status-review-bg); color: var(--status-review-ink); }
    .uat-blocked { background-color: var(--type-bug-bg); color: var(--type-bug-ink); }
    .uat-na { background-color: var(--gray-100); color: var(--gray-500); }
    .uat-default { background-color: var(--gray-50); color: var(--gray-500); border: 1px solid var(--line); }

    /* Epic Styling & Indentation */
    .row-epic {
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        /* Add gap between epic groups */
        border-top: 16px solid var(--bg);
        background-clip: padding-box; /* Ensures background doesn't bleed into border */
    }
    
    /* Remove top border for the very first epic to avoid double spacing at top */
    .row-epic:first-child {
        border-top: none;
    }
    
    .row-epic td {
        font-weight: 700;
        color: var(--ink);
        padding-top: 1rem;
        padding-bottom: 1rem;
    }
    
    .row-epic .col-jira {
        position: relative;
    }
    
    /* Remove Epic Tail */
    .row-epic .col-jira::before {
        display: none;
    }
    
    .row-epic td:first-child {
        border-left: 4px solid var(--primary);
    }

    /* HIERARCHY VISUALIZATION - Clean Indentation with Accents */
    
    /* Animation for drawer opening effect */
    @keyframes openDrawerStory {
        from {
            opacity: 0;
            transform: translateY(-15px);
            padding-top: 0;
            padding-bottom: 0;
        }
        to {
            opacity: 1;
            transform: translateY(0);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
    }

    @keyframes closeDrawerStory {
        from {
            opacity: 1;
            transform: translateY(0);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        to {
            opacity: 0;
            transform: translateY(-15px);
            padding-top: 0;
            padding-bottom: 0;
        }
    }

    @keyframes openDrawerBug {
        from {
            opacity: 0;
            transform: translateY(-10px);
            padding-top: 0;
            padding-bottom: 0;
        }
        to {
            opacity: 1;
            transform: translateY(0);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
    }

    @keyframes closeDrawerBug {
        from {
            opacity: 1;
            transform: translateY(0);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        to {
            opacity: 0;
            transform: translateY(-10px);
            padding-top: 0;
            padding-bottom: 0;
        }
    }

    /* Story Row */
    .row-story {
        background-color: #f8fafc; /* Very light gray */
    }
    
    /* Apply animation to cells for height expansion effect */
    .row-story td {
        border-top: 1px solid #f1f5f9;
        padding-top: 1rem;
        padding-bottom: 1rem;
        animation: openDrawerStory 0.3s ease-out forwards;
    }

    .row-story.closing td {
        animation: closeDrawerStory 0.2s ease-in forwards;
    }
    
    .row-story td:first-child {
        border-left: 4px solid var(--secondary); /* Blue accent */
    }
    
    .row-story .col-jira {
        padding-left: 2.5rem !important;
        position: relative;
        font-weight: 600;
    }

    /* Remove Story Lines by default */
    .row-story .col-jira::before,
    .row-story .col-jira::after {
        display: none;
    }

    /* Add Vertical Line when Story is Expanded */
    .row-story.expanded .col-jira::before {
        display: block;
        content: '';
        position: absolute;
        left: 3.25rem;
        width: 2px;
        background-color: #cbd5e1;
        top: calc(50% + 14px);
        bottom: 0;
        z-index: 1;
        opacity: 0.6;
    }
    
    /* Bug Row */
    .row-bug-child {
        background-color: #ffffff; /* White - Clean look */
    }
    
    .row-bug-child:hover {
        background-color: #f8fafc;
    }
    
    .row-bug-child td {
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        border-bottom: none;
        color: var(--muted);
        animation: openDrawerBug 0.3s ease-out forwards;
    }

    .row-bug-child.closing td {
        animation: closeDrawerBug 0.2s ease-in forwards;
    }

    .row-bug-child td:first-child {
        border-left: 4px solid #e11d48; /* Rose accent */
    }

    .row-bug-child .col-jira {
        padding-left: 9rem !important; /* Extra Deep indentation */
        position: relative;
    }
    
    /* Tree Line - Vertical (Trunk) */
    .row-bug-child .col-jira::before {
        content: '';
        display: block;
        position: absolute;
        left: 3.25rem; /* Aligns with Story expander */
        top: -1px; /* Connect to row above */
        bottom: 0;
        width: 2px;
        background-color: #cbd5e1;
        opacity: 0.6;
    }

    /* Tree Line - Horizontal (Branch) */
    .row-bug-child .col-jira::after {
        content: '';
        display: block;
        position: absolute;
        left: 3.25rem;
        width: 5rem;
        top: 50%;
        height: 2px;
        background-color: #cbd5e1;
        opacity: 0.6;
    }

    /* Last Child - L Shape */
    .row-bug-child.is-last-child .col-jira::before {
        background-color: transparent;
        width: 5rem;
        height: calc(50% + 1px);
        border-left: 2px solid #cbd5e1;
        border-bottom: 2px solid #cbd5e1;
        border-bottom-left-radius: 8px;
        bottom: auto;
        /* Reset standard properties */
        top: -1px;
        transform: none;
        opacity: 0.6;
    }
    
    .row-bug-child.is-last-child .col-jira::after {
        display: none;
    }

    /* Remove Termination Logic for Story */
    .row-story.is-last-child .col-jira::before {
        display: none;
    }
    
    /* Expander Styling Update */
    .expander { 
        cursor: pointer; 
        user-select: none; 
        display: inline-flex; 
        align-items: center; 
        justify-content: center; 
        transition: all 0.2s; 
        width: 1.5rem; 
        height: 1.5rem; 
        border-radius: 4px;
        color: var(--muted);
        background: #f1f5f9; /* Light gray background to stand out */
        border: 1px solid #e2e8f0;
        position: relative;
        z-index: 5; 
        margin-right: 0.5rem;
    }
    
    .expander.placeholder {
        background: transparent;
        border: none;
    }
    
    .expander:hover { 
        background-color: #e2e8f0; 
        color: var(--ink); 
    }
    
    .expanded .expander { 
        transform: rotate(90deg); 
        background-color: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary-light);
    }

    /* Reset Summary Column */
    .row-story .col-summary, .row-bug-child .col-summary {
        color: var(--gray-500);
        padding-left: 1rem !important;
    }
    
    /* Bug Specific Visuals to make them distinct */
    .row-bug-child .col-jira a {
        color: #e11d48; /* Rose 600 */
        font-weight: 500;
    }
    
    .row-bug-child .type-pill {
        background-color: #ffe4e6; /* Rose 100 */
        color: #e11d48;
    }

    html { font-size: 14px; height: 100%; width: 100%; overflow: hidden; } 
    body { margin:0; background:var(--bg); color:var(--ink); font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; height: 100%; width: 100%; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
    
    /* Loading overlay */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(246, 248, 252, 0.95);
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
    }
    
    .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }
    
    .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--line);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .loading-text {
        margin-top: 16px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 500;
    }
    
    /* Modern header styling - ClickUp inspired */

        background: var(--surface);

        gap: 1.25rem; 
        align-items: center; 
        justify-content: space-between; 
        padding: 0 1.5rem;
        height: 100%;
    }
    
    .brand { 
        display: flex; 
        align-items: center; 
        gap: 0.625rem; 
        font-weight: 700; 
        font-size: 1.25rem;
        color: var(--primary);
        margin-right: 0.5rem;
    }
    
    .brand .logo { 
        width: 30px; 
        height: 30px; 
        border-radius: 8px; 
        background-image: linear-gradient(135deg, var(--primary), #9d8df9);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;

    .search-container {
        position: relative;
        flex: 1;
        max-width: 480px;
    }
    
    .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);

        pointer-events: none;
    }
    
    .input-search {

        padding: 0.625rem 0.75rem 0.625rem 2.25rem;

        border: 1px solid var(--line);

    .input-search:focus {

        outline: none;
    }
    
    .header-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .input, .select { 
        border: 1px solid var(--line); 
        border-radius: 6px; 
        padding: 0.5rem 0.75rem; 
        background: var(--surface); 
        transition: all 0.2s ease;

    }
    
    .input:focus, .select:focus { 
        border-color: var(--primary);

    /* Manual field dropdowns in table cells */
    .manual-field-dropdown {
        font-size: 0.875rem !important;
        min-width: 100px;
        width: 100%;
        padding: 0.25rem 0.5rem;
    }
    
    /* Modern button styling */
    .btn { 
        cursor: pointer; 
        font-weight: 500; 
        text-decoration: none; 
        color: var(--ink); 
        display: inline-flex; 
        align-items: center; 
        justify-content: center;
        gap: 0.375rem; 
        border-radius: 6px;
        padding: 0 0.875rem;
        border: 1px solid var(--gray-200);
        background: var(--surface);
        font-size: 0.875rem;
        height: 2.25rem;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-xs);
        white-space: nowrap;
    }
    
    .btn:hover { 
        border-color: var(--gray-300); 
        background-color: var(--gray-50);
    }
    
    .btn:active {
        transform: translateY(1px);
    }
    
    .btn.primary { 
        background: var(--primary); 
        color: var(--primary-ink); 
        border-color: var(--primary);
    }
    
    .btn.primary:hover { 
        background: var(--primary-hover); 
        border-color: var(--primary-hover);
        box-shadow: 0 2px 5px rgba(123, 104, 238, 0.3);
    }
    
    .btn.secondary { 
        background: var(--secondary-light); 
        color: var(--secondary); 
        border-color: var(--secondary-light);
    }
    
    .btn.secondary:hover { 
        background: #dfeaff;
        border-color: #dfeaff;
    }
    
    /* Icon button */
    .btn-icon {
        width: 2.25rem;
        padding: 0;
        justify-content: center;
    }
    
    .btn-sm {
        height: 1.875rem;
        padding: 0 0.625rem;
        font-size: 0.8125rem;
    }

    /* Modern dropdown menus (ClickUp style) */
    .dropdown {
        position: relative;
    }
    
    .dropdown-toggle {
        position: relative;
    }
    
    .dropdown-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 0.5rem);
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        border: 1px solid var(--line);
        min-width: 220px;
        overflow: hidden;
        z-index: 100;
        opacity: 0;
        transform: translateY(-10px);
        pointer-events: none;
        transition: all 0.2s ease;
    }
    
    .dropdown-menu.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }
    
    .dropdown-item {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.625rem 1rem;
        color: var(--ink);
        font-size: 0.875rem;
        text-decoration: none;
        transition: background-color 0.15s ease;
    }
    
    .dropdown-item:hover {
        background-color: var(--gray-50);
    }
    
    .dropdown-item svg,
    .dropdown-item i {
        color: var(--muted);
        font-size: 1rem;
        width: 1rem;

        flex-shrink: 0;
    }
    
    .dropdown-divider {
        height: 1px;
        background-color: var(--line);
        margin: 0.375rem 0;
    }
    
    .dropdown-header {
        padding: 0.5rem 1rem;
        font-size: 0.75rem;

    }
    
    /* Version badge */

    .table-controls-bar .filters-section select {

    .table-controls-bar .btn-danger {

    /* Upload Progress Styles */
