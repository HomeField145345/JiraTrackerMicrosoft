<script>
/**
 * @file Dashboard.js
 * @description Main entry point for the dashboard client-side script.
 */

// --- INITIALIZATION ---
document.addEventListener('DOMContentLoaded', function() {
  setupEventListeners(); // Set up all user interaction listeners
  
  // Check user role and setup workspace selector if needed
  const user = (typeof getStoredProjectHubUser === 'function') ? getStoredProjectHubUser() : {};
  const userRole = String(user.role || '').toLowerCase().replace(/\s+/g, '_');
  
  // Hide Config button for non-admins
  if (userRole !== 'admin') {
      const configBtn = document.getElementById('configBtn');
      if (configBtn) configBtn.style.display = 'none';
  }

  const canSwitchWorkspace = userRole === 'admin' || userRole === 'project_manager' || userRole.includes('qa') || userRole.includes('tester') || userRole.includes('view');
  const currentUsername = user.username || '';

  if (canSwitchWorkspace) {
    const usedPreloadedData = currentUsername ? tryConsumePreloadedData(currentUsername) : false;
    if (!usedPreloadedData && currentUsername) {
      refreshData(currentUsername);
    }
    setupWorkspaceSelector(currentUsername);
  } else {
    if (!tryConsumePreloadedData(currentUsername)) {
      refreshData();
    }
  }
  
  // Add event listener to save filter state and perform cleanup before leaving the page
  EventManager.addEventListener(window, 'beforeunload', function() {
    // Save user state to localStorage
    saveFilterState();
    
    // Perform full application cleanup
    AppCleanup.fullCleanup();
  }, false, 'beforeunload_handler');
});

function setupWorkspaceSelector(initialUsername) {
  const token = checkAuth();
  if (!token) return;
  const currentUser = (typeof getStoredProjectHubUser === 'function') ? getStoredProjectHubUser() : {};
  const currentUsername = initialUsername || currentUser.username || '';

  const container = document.getElementById('workspace-selector-container');
  const selector = document.getElementById('workspace-select');
  
  if (container && selector) {
    container.classList.remove('hidden');
    // Keep only the placeholder option before repopulating
    selector.innerHTML = '<option value="" disabled>Select Workspace</option>';
    
    // Fetch workspace owners
    google.script.run
      .withSuccessHandler(function(owners) {
        // Populate dropdown
        owners.forEach(function(owner) {
          const option = document.createElement('option');
          option.value = owner.username;
          option.textContent = owner.displayName + ' (' + owner.username + ')';
          selector.appendChild(option);
        });
        
        // Add change listener
        if (!selector.dataset.workspaceListenerBound) {
          selector.addEventListener('change', function() {
            const selectedUser = this.value;
            if (selectedUser) {
              refreshData(selectedUser);
            }
          });
          selector.dataset.workspaceListenerBound = 'true';
        }
        
        // Select current user's workspace first (if available), otherwise first owner
        if (owners.length > 0) {
            let preferredOptionIndex = -1;
            for (let i = 0; i < selector.options.length; i++) {
              if (selector.options[i].value === currentUsername) {
                preferredOptionIndex = i;
                break;
              }
            }

            if (preferredOptionIndex === -1 && selector.options.length > 1) {
              preferredOptionIndex = 1;
            }

            if (preferredOptionIndex > 0) {
              selector.selectedIndex = preferredOptionIndex;
              if (APP_STATE.currentWorkspaceUsername !== selector.value) {
                refreshData(selector.value);
              }
            } else {
              hideLoading();
              alert("No workspaces found to view.");
            }
        } else {
             hideLoading();
             alert("No workspaces found to view.");
        }
        
      })
      .withFailureHandler(function(err) {
        console.error("Failed to load workspace owners", err);
        hideLoading();
        alert("Failed to load workspace list.");
      })
      .getWorkspaceOwners(token);
  }
}
</script>
