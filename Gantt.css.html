<style>
.gantt-container {
  display: grid;
  /* Define two main columns: one for task names, one for the timeline */
  grid-template-columns: 250px 1fr;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
}

/* --- Header Styling --- */
.gantt-header-name {
  grid-column: 1;
  padding: 0.5rem 1rem;
  border-right: 1px solid var(--line);
  border-bottom: 2px solid var(--line);
  font-weight: 600;
  color: var(--muted);
  /* CORRECTED STICKY BEHAVIOR */
  position: sticky;
  top: 0;
  left: 0;
  background: var(--surface);
  z-index: 6; /* Highest z-index for the top-left corner */
}

.gantt-header-timeline {
  grid-column: 2;
  display: grid;
  /* Explicitly define two rows for the header: one for months, one for days */
  grid-template-rows: auto auto;
  grid-auto-columns: 40px; /* Each day column is 40px wide */
  grid-auto-flow: column;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 5;
}

.gantt-month-header {
  grid-column: var(--start) / span var(--span);
  grid-row: 1; /* Months are on the first row */
  text-align: center;
  font-weight: 600;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

.gantt-header-cell {
  grid-row: 2; /* Days are on the second row */
  padding: 0.5rem 0;
  text-align: center;
  border-right: 1px solid var(--line);
  font-size: 0.75rem;
  color: var(--muted);
}

/* --- Row & Bar Styling --- */
.gantt-row-name {
  grid-column: 1;
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 4; /* Lower z-index so it slides under the main header */
  padding: 0.5rem 1rem;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 0.85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}

.gantt-row-timeline {
  grid-column: 2;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 40px;
  border-bottom: 1px solid var(--line);
  position: relative;
}

.gantt-bar {
  grid-column: var(--start) / span var(--span);
  height: 1.75rem;
  margin: auto 0.15rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
  color: white;
  display: flex;
  align-items: center;
}

.gantt-bar:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
  opacity: 0.9;
}

.bar-epic {
  background-color: #4f46e5;
  height: 1.25rem;
  font-weight: 600;
}

.bar-story {
  background-color: #7c3aed;
}

.gantt-row-name-story {
  padding-left: 2.5rem;
  font-weight: normal;
}

/* Tooltip for hover */
.gantt-bar .tooltip {
  visibility: hidden;
  width: 240px;
  background-color: #111827;
  color: #fff;
  text-align: left;
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  position: absolute;
  z-index: 10;
  bottom: 125%;
  left: 0;
  opacity: 0;
  transition: opacity 0.3s;
  font-size: 0.8rem;
  line-height: 1.4;
}

.gantt-bar:hover .tooltip {
  visibility: visible;
  opacity: 1;
}
</style>
