<script>
/**
 * @file tasks.js
 * @description Logic for the My Tasks view in Dashboard.
 */

// Initialize tasks view
function initTasksView() {
    const refreshBtn = document.getElementById('refresh-tasks-btn');
    if (refreshBtn) {
        refreshBtn.addEventListener('click', function() {
            // Trigger a full data refresh
            if (typeof loadData === 'function') {
                loadData();
            }
        });
    }

    const addPersonalBtn = document.getElementById('add-personal-task-btn');
    if (addPersonalBtn) {
        addPersonalBtn.addEventListener('click', function() {
            APP_STATE.currentEditId = null;
            closeModal();
            
            populateTaskDropdowns();
            
            const priorityEl = document.getElementById('t-priority');
            if (priorityEl) priorityEl.value = 'Medium';
            
            // Set current user as assignee and owner
            const user = JSON.parse(localStorage.getItem('projectHubUser') || '{}');
            const username = user.username || '';
            const assigneeEl = document.getElementById('t-assignee');
            if (assigneeEl) assigneeEl.value = username;
            
            openModal('New Personal Task');
        });
    }
    
    // Ensure modal save works for tasks
    const modalSave = document.getElementById('modalSave');
    if (modalSave) {
        // Remove existing listeners to avoid duplicates if init is called multiple times
        // (In a real app, we'd handle this better, but for now we assume init is called once or we rely on EventManager)
        // Since we don't have easy removeEventListener without the original function reference, 
        // we'll assume this is set up in main.js or we add a specific handler here if not present.
        // Actually, main.js/ui.js likely handles modalSave. We just need to hook into it or ensure handleSaveTaskLocal is called.
        // But wait, the modal is shared. We need to know if we are saving a task.
        // We can check the modal title or a hidden field.
        
        // For now, let's assume the existing save handler in tasks.js.html was correct, 
        // but we need to integrate it with the global save handler if there is one.
        // The previous tasks.js.html added a listener to modalSave.
        
        modalSave.addEventListener('click', function(e) {
            const title = document.getElementById('modalTitle');
            if (title && (title.textContent.includes('Task') || title.textContent.includes('Personal'))) {
                handleSaveTaskLocal();
            }
        });
    }
}

// Call init on load
document.addEventListener('DOMContentLoaded', initTasksView);

function renderTasksView() {
    const assignedContainer = document.getElementById('assigned-tasks-list');
    const personalContainer = document.getElementById('personal-tasks-list');
    
    if (!assignedContainer || !personalContainer) return;
    
    // Show loading state if data is not ready
    if (!APP_STATE.allData || !APP_STATE.allData.projects) {
        assignedContainer.innerHTML = '<div class="text-center text-gray-400 py-8">Loading...</div>';
        personalContainer.innerHTML = '<div class="text-center text-gray-400 py-8">Loading...</div>';
        return;
    }

    const user = JSON.parse(localStorage.getItem('projectHubUser') || '{}');
    const username = (user.username || '').toLowerCase();
    const displayName = (user.displayName || '').toLowerCase();
    
    if (!username) {
        assignedContainer.innerHTML = '<div class="text-center text-red-400 py-8">Please log in to view tasks.</div>';
        return;
    }

    // Filter Assigned Tasks (Jira + Independent)
    const assignedTasks = [];
    
    // Jira Tasks
    (APP_STATE.allData.projects || []).forEach(function(p) {
        const assignee = (p.Assignee || '').toLowerCase();
        // Check if assigned to user
        if (assignee.includes(displayName) || assignee.includes(username)) {
            assignedTasks.push({
                ...p,
                _isJira: true,
                _id: p['Jira #'],
                _title: p.Summary,
                _status: p.Status,
                _type: p['Issue Type'],
                _priority: p.Priority,
                _due: p['Target Date'] // Use Target Date for Jira items
            });
        }
    });
    
    // Independent Tasks (Assigned)
    (APP_STATE.allData.independentTasks || []).forEach(function(t) {
        const assignee = (t.Assignee || '').toLowerCase();
        if (assignee.includes(displayName) || assignee.includes(username)) {
            assignedTasks.push({
                ...t,
                _isJira: false,
                _id: t.ID,
                _title: t.Title,
                _status: t.Status,
                _type: 'Task',
                _priority: t.Priority,
                _due: t.Due
            });
        }
    });

    // Filter Personal Tasks (Independent tasks created by user, regardless of assignee, or maybe just those NOT assigned to me but owned by me?)
    // Let's show all Independent Tasks where Owner is user.
    const personalTasks = (APP_STATE.allData.independentTasks || []).filter(function(t) {
        const owner = (t.Owner || '').toLowerCase();
        return owner === username;
    }).map(function(t) {
        return {
            ...t,
            _isJira: false,
            _id: t.ID,
            _title: t.Title,
            _status: t.Status,
            _type: 'Task',
            _priority: t.Priority,
            _due: t.Due
        };
    });

    // Update counts
    const assignedCountEl = document.getElementById('assigned-count');
    if (assignedCountEl) assignedCountEl.textContent = assignedTasks.length;
    
    const personalCountEl = document.getElementById('personal-count');
    if (personalCountEl) personalCountEl.textContent = personalTasks.length;

    // Render Lists
    renderTaskList(assignedContainer, assignedTasks, 'No tasks assigned to you.');
    renderTaskList(personalContainer, personalTasks, 'No personal tasks found.');
}

function renderTaskList(container, tasks, emptyMessage) {
    if (tasks.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">' + emptyMessage + '</div>';
        return;
    }

    // Sort by Due Date
    tasks.sort((a, b) => {
        const dateA = a._due ? new Date(a._due) : new Date(8640000000000000);
        const dateB = b._due ? new Date(b._due) : new Date(8640000000000000);
        return dateA - dateB;
    });

    let html = '';
    tasks.forEach(task => {
        const isJira = task._isJira;
        const id = task._id;
        const title = task._title;
        const status = task._status || 'Open';
        const priority = task._priority || 'Medium';
        const type = task._type;
        const dueDate = task._due ? new Date(task._due).toLocaleDateString() : '';
        
        // Border color based on priority
        let borderClass = 'border-l-4 border-gray-300';
        if (priority === 'High' || priority === 'Critical') borderClass = 'border-l-4 border-red-500';
        if (priority === 'Medium') borderClass = 'border-l-4 border-yellow-500';
        if (priority === 'Low') borderClass = 'border-l-4 border-blue-500';

        html += `
            <div class="bg-white p-3 rounded shadow-sm border border-gray-200 ${borderClass} hover:shadow-md transition-shadow group relative">
                <div class="flex justify-between items-start">
                    <div class="w-full">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-mono bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">${id}</span>
                            <span class="text-xs font-medium px-1.5 py-0.5 rounded ${isJira ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">${type}</span>
                            ${dueDate ? `<span class="text-xs text-gray-500 flex items-center gap-1 ml-auto"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> ${dueDate}</span>` : ''}
                        </div>
                        <h4 class="font-medium text-gray-900 text-sm leading-tight mb-2">${title}</h4>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span class="bg-gray-100 px-2 py-0.5 rounded-full">${status}</span>
                            ${!isJira ? `
                            <button onclick="editTask('${id}')" class="opacity-0 group-hover:opacity-100 transition-opacity text-blue-600 hover:text-blue-800 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function handleSaveTaskLocal() {
    var taskData = {
        ID: APP_STATE.currentEditId,
        Title: document.getElementById('t-title').value,
        Assignee: document.getElementById('t-assignee').value,
        Status: document.getElementById('t-status').value,
        Priority: document.getElementById('t-priority').value,
        Due: document.getElementById('t-due').value,
        Project: document.getElementById('t-project').value,
        Tags: document.getElementById('t-tags').value,
        Description: document.getElementById('t-desc').value
    };
    
    // Use the API function from api.js.html
    saveTask(taskData);
}

function editTask(id) {
    populateTaskDropdowns();
    const task = APP_STATE.allData.independentTasks.find(t => t.ID === id);
    if (task) {
        APP_STATE.currentEditId = task.ID;
        document.getElementById('t-title').value = task.Title || '';
        document.getElementById('t-assignee').value = task.Assignee || '';
        document.getElementById('t-status').value = task.Status || '';
        document.getElementById('t-priority').value = task.Priority || 'Medium';
        
        // Format date for input
        let dateStr = '';
        if (task.Due) {
            try {
                const d = new Date(task.Due);
                if (!isNaN(d.getTime())) {
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    dateStr = `${y}-${m}-${day}`;
                }
            } catch(e) {}
        }
        document.getElementById('t-due').value = dateStr;
        
        document.getElementById('t-project').value = task.Project || '';
        document.getElementById('t-tags').value = task.Tags || '';
        document.getElementById('t-desc').value = task.Description || '';
        
        openModal('Edit Task');
    }

    function populateTaskDropdowns() {
        if (!APP_STATE.allData) return;

        // Populate Status
        const statusSelect = document.getElementById('t-status');
        if (statusSelect) {
            statusSelect.innerHTML = '';
            const statuses = (APP_STATE.allData.config && APP_STATE.allData.config.independentTaskStatusOptions && APP_STATE.allData.config.independentTaskStatusOptions.length > 0) 
                ? APP_STATE.allData.config.independentTaskStatusOptions 
                : ['Open', 'In Progress', 'Done'];
            
            statuses.forEach(function(s) {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                statusSelect.appendChild(opt);
            });
        }

        // Populate Assignee
        const assigneeSelect = document.getElementById('t-assignee');
        if (assigneeSelect) {
            assigneeSelect.innerHTML = '<option value="">Select Assignee</option>';
            const users = APP_STATE.allData.users || [];
            users.forEach(function(u) {
                const opt = document.createElement('option');
                opt.value = u.username;
                opt.textContent = u.displayName || u.username;
                assigneeSelect.appendChild(opt);
            });
        }

        // Populate Project (Epics)
        const projectSelect = document.getElementById('t-project');
        if (projectSelect) {
            projectSelect.innerHTML = '<option value="">Select Project</option>';
            const epics = (APP_STATE.allData.projects || []).filter(function(p) { return p['Issue Type'] === 'Epic'; });
            epics.forEach(function(e) {
                const opt = document.createElement('option');
                opt.value = e.Summary; 
                opt.textContent = e.Summary;
                projectSelect.appendChild(opt);
            });
        }
    }
}
</script>
